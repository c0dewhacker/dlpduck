apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dlpduck.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  containers:
    - name: wget
      image: busybox:1.37.0
      command: [wget]
      args: ["-qO-", "http://{{ include "dlpduck.fullname" . }}:{{ .Values.service.port }}/health/live"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
