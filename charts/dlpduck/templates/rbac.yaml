{{- if eq (include "dlpduck.leaderElection" .) "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dlpduck.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
rules:
  # get/create/update on one named Lease is all leader election needs —
  # no list/watch, and nothing outside this namespace.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ (dig "cluster" "lease_name" "dlpduck-watcher" .Values.configuration.data) | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dlpduck.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dlpduck.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dlpduck.fullname" . }}-leader-election
{{- end }}
