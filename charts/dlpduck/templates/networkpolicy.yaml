{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dlpduck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dlpduck.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - {{- toYaml . | nindent 6 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
