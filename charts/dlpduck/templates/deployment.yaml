{{- $replicaCount := .Values.replicaCount | int }}
{{- if gt $replicaCount 1 }}
{{- range $store := list "drop" "archive" "quarantine" "work" "audit" }}
{{- $settings := index $.Values.persistence $store }}
{{- if not $settings.enabled }}
{{- fail (printf "persistence.%s.enabled is false, but replicaCount is %d. An emptyDir is local to one pod — with more than one replica each would silently get its own disconnected state instead of sharing one, with no error to warn you. See DEPLOYMENT.md's \"More than one replica\" section." $store $replicaCount) }}
{{- end }}
{{- if not (has "ReadWriteMany" $settings.accessModes) }}
{{- fail (printf "persistence.%s.accessModes is %v, but replicaCount is %d. Every store needs ReadWriteMany, on storage with real POSIX file locking, once more than one replica is running — see DEPLOYMENT.md's \"More than one replica\" section." $store $settings.accessModes $replicaCount) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlpduck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # One replica keeps the original guarantee (a terminating pod is
    # fully gone before its replacement starts) for anyone who hasn't
    # opted into more. More than one only makes sense once
    # configuration.data.cluster.leader_election is set to "kubernetes" —
    # RollingUpdate is safe there because a terminating pod releases its
    # lease as part of graceful shutdown (see dlpduck.leader), letting a
    # new replica take over promptly instead of waiting out the lease.
    type: {{ if gt (.Values.replicaCount | int) 1 }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      {{- include "dlpduck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.configuration.existingConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dlpduck.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: document-processor
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dlpduck.serviceAccountName" . }}
      # Only mounted for Kubernetes-Lease leader election, which is the
      # one thing in this image that talks to the API server at all.
      automountServiceAccountToken: {{ eq (include "dlpduck.leaderElection" .) "kubernetes" }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dlpduck
          image: {{ include "dlpduck.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/dlpduck/{{ .Values.configuration.key }}"]
          env:
            - name: DLPDUCK_RUN_BOTH
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Falls back to $HOSTNAME (already the pod name in a
            # Deployment) if unset — set explicitly so leader election's
            # identity survives even where that fallback doesn't hold.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DLPDUCK_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- if .Values.logging.traceContentOutput }}
            - name: DLPDUCK_TRACE_CONTENT_OUTPUT
              value: "true"
            {{- end }}
            {{- range $name, $value := .Values.configuration.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "dlpduck.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dlpduck
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: drop
              mountPath: /data/drop
            - name: archive
              mountPath: /data/archive
            - name: quarantine
              mountPath: /data/quarantine
            - name: work
              mountPath: /data/work
            - name: audit
              mountPath: /data/audit
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dlpduck.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- range $store := list "drop" "archive" "quarantine" "work" "audit" }}
        {{- $settings := index $.Values.persistence $store }}
        - name: {{ $store }}
          {{- if $settings.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dlpduck.claimName" (list $ $store) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
