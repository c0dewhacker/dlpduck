{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dlpduck.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dlpduck.labels" . | nindent 4 }}
type: Opaque
stringData:
  DLPDUCK_HMAC_KEY: {{ required "secrets.hmacKey is required; generate one with: openssl rand -hex 32" .Values.secrets.hmacKey | quote }}
  DLPDUCK_SESSION_SECRET: {{ required "secrets.sessionSecret is required; generate one with: openssl rand -hex 32" .Values.secrets.sessionSecret | quote }}
  {{- with .Values.secrets.extra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
