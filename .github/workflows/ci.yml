name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy dlpduck/

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            coverage: true
          - python-version: "3.13"
            coverage: false
          - python-version: "3.14"
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -q -n 2 --dist=loadscope
      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: uv run pytest -q -n 2 --dist=loadscope --cov=dlpduck --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  shipped-config:
    name: Validate shipped configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python 3.12
      - name: Validate from outside the checkout
        env:
          DLPDUCK_HMAC_KEY: ci-only-not-a-real-key
          DLPDUCK_OIDC_CLIENT_SECRET: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          uv run python - "$workdir" <<'PY'
          import pathlib
          import sys

          import yaml

          workdir = pathlib.Path(sys.argv[1])
          cfg = yaml.safe_load(pathlib.Path("config.example.yaml").read_text())
          (workdir / "drops").mkdir(parents=True)
          cfg["source"]["path"] = str(workdir / "drops")
          cfg["destination"] = {
              "archive": str(workdir / "archive"),
              "quarantine": str(workdir / "quarantine"),
              "work_dir": str(workdir / "work"),
          }
          cfg["console"]["auth"]["users"] = []
          (workdir / "config.yaml").write_text(yaml.safe_dump(cfg))
          PY
          uv run dlpduck validate-config --config "$workdir/config.yaml"
