version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
